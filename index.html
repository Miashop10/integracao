<style>
/* =========================================================
   CONFIGURAÇÃO: cole abaixo, no script, a URL do App da Web
   (const API_URL). Sem URL o sistema roda em MODO DEMO.
   ========================================================= */
:root{
  --rosa:#EC2A90;--azul:#00AEEF;--roxo:#A6538A;--vinho:#D2395D;--limao:#C9DD3C;--laranja:#F18634;
  --ink:#161616;--bg:#F5F4F0;--panel:#FFFFFF;--muted:#6C6A66;--line:#E6E3DC;--soft:#FAF9F6;
  --red:#D93636;--ok:#1E9E5A;
  --grad:linear-gradient(90deg,#00AEEF 0%,#EC2A90 30%,#C9DD3C 55%,#D2395D 78%,#A6538A 100%);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;margin:0}
svg{display:block}
.hidden{display:none!important}

/* ---------- botões / campos ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#cfcbc2;background:var(--soft)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.rosa{background:var(--rosa);border-color:var(--rosa);color:#fff}
.btn.rosa:hover{filter:brightness(.95)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:.15s}
.inp:focus{border-color:var(--rosa);box-shadow:0 0 0 3px rgba(236,42,144,.15)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.4}
.hint{font-size:12px;color:var(--muted)}
.warn{font-size:12px;color:#B5651D;background:#FFF4E6;border-radius:8px;padding:8px 10px;margin:-4px 0 12px}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
#login .art{position:relative;overflow:hidden;background:#161616;display:flex;flex-direction:column;justify-content:flex-end;padding:56px;color:#fff}
#login .art svg.waves{position:absolute;inset:0;width:100%;height:100%}
#login .art h2{position:relative;font-size:44px;line-height:1.05;font-weight:700;max-width:520px}
#login .art p{position:relative;opacity:.8;font-size:18px;margin:14px 0 0;max-width:480px}
#login .box{display:flex;align-items:center;justify-content:center;padding:40px 24px}
#login form{width:100%;max-width:380px}
#login .lg{height:64px;margin-bottom:34px}
#login h1{font-size:28px;margin-bottom:6px}
#login .sub{color:var(--muted);margin:0 0 28px}
#login .err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin:-4px 0 10px}
@media(max-width:860px){#login{grid-template-columns:1fr}#login .art{min-height:220px;padding:28px}#login .art h2{font-size:28px}#login .art p{font-size:15px}}

/* ---------- app ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .in{display:flex;align-items:center;gap:18px;padding:10px 20px}
.hdr .lg{height:34px}
.hdr .gbar{height:4px;background:var(--grad)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:800;cursor:pointer;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab svg{width:18px;height:18px}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.hdr .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--rosa);color:#fff;display:grid;place-items:center;font-weight:800;font-family:Jost}
.who .nm{line-height:1.15}.who .nm small{display:block;color:var(--muted);font-size:12px}
.demo{background:#FFF4E6;color:#8A4B0F;font-size:13px;font-weight:700;padding:8px 20px;text-align:center}
main.view{flex:1;padding:26px 20px 60px;max-width:1500px;width:100%;margin:0 auto}
@media(max-width:760px){.hdr .in{flex-wrap:wrap;gap:10px}.tabs{order:3;width:100%;margin:0;overflow-x:auto}.who .nm{display:none}}

/* ---------- scaler (slide 16:9 em qualquer tamanho) ---------- */
.scaler{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#fff}
.scaler>.stg{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.hero .scaler{border-radius:14px;box-shadow:0 20px 50px -30px rgba(0,0,0,.45);cursor:pointer}
.hero h2{font-size:34px;line-height:1.1}
.hero p{color:var(--muted);font-size:16px;margin:10px 0 22px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{padding:13px 20px;font-size:15px}
.secH{display:flex;align-items:end;justify-content:space-between;margin:34px 2px 14px}
.secH h3{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.th{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.th:hover{transform:translateY(-2px);box-shadow:0 14px 30px -20px rgba(0,0,0,.4)}
.th .cap{display:flex;gap:8px;align-items:baseline;padding:9px 12px;font-size:13px;font-weight:700}
.th .cap b{color:var(--rosa);font-family:Jost}
.th .cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:860px){.hero{grid-template-columns:1fr}}

/* ---------- editor ---------- */
.ed{display:grid;grid-template-columns:270px minmax(0,1fr) 420px;gap:18px;align-items:start}
.pane{background:#fff;border:1px solid var(--line);border-radius:18px}
.ed .list{position:sticky;top:84px;max-height:calc(100vh - 110px);display:flex;flex-direction:column}
.ed .list .lh{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed .list .items{overflow:auto;padding:8px}
.li{display:flex;gap:10px;align-items:center;padding:7px;border-radius:12px;cursor:pointer;border:2px solid transparent;position:relative}
.li:hover{background:var(--soft)}
.li.on{border-color:var(--rosa);background:#FFF5FA}
.li.off{opacity:.45}
.li .n{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:700;font-size:13px;width:20px;text-align:right;color:var(--muted)}
.li .mini{width:104px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.li .t{font-size:12.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.li.drop-b{box-shadow:0 3px 0 0 var(--rosa)}.li.drop-a{box-shadow:0 -3px 0 0 var(--rosa)}
.ed .prev{padding:16px;position:sticky;top:84px}
.ed .prev .scaler{border-radius:12px;box-shadow:0 18px 40px -28px rgba(0,0,0,.5);border:1px solid var(--line)}
.ed .bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ed .bar .st{font-size:13px;color:var(--muted);margin-left:auto}
.ed .bar .st.dirty{color:#B5651D;font-weight:800}
.ed .form{padding:18px}
.ed .form h4{font-size:16px;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
.ed .form hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.itm{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--soft)}
.itm .r{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.itm .r .inp{padding:7px 8px}
.itm .ipv{width:34px;height:34px;flex:none;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.itm .ipv svg{width:20px;height:20px}
.itm .cnt{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}
.itm .cnt.long{color:#B5651D;font-weight:800}
.imgbox{border:2px dashed var(--line);border-radius:12px;padding:12px;text-align:center}
.imgbox img{max-width:100%;max-height:150px;border-radius:8px;display:block;margin:0 auto 10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
@media(max-width:1280px){.ed{grid-template-columns:230px minmax(0,1fr)}.ed .form{grid-column:1/-1}.ed .prev{position:static}}
@media(max-width:760px){.ed{grid-template-columns:1fr}.ed .list{position:static;max-height:320px}}

/* ---------- usuários ---------- */
.uw{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.uw .pane{padding:20px}
.uw h3{font-size:19px;margin-bottom:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.bdg{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:#EAF7EF;color:var(--ok)}
.bdg.off{background:#F1F0ED;color:var(--muted)}.bdg.m{background:#161616;color:#fff}
.tw{overflow-x:auto}
@media(max-width:960px){.uw{grid-template-columns:1fr}}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(22,22,22,.5);display:grid;place-items:center;z-index:200;padding:20px}
.md{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.md h3{font-size:21px;margin-bottom:10px}
.md p{color:var(--muted);margin:0 0 16px;line-height:1.5}
.md .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.lays{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lay{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;background:#fff}
.lay:hover{border-color:var(--rosa);background:#FFF5FA}
.lay b{display:block;font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-size:15px}.lay small{color:var(--muted)}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:tin .2s}
.toast.err{background:var(--red)}.toast.ok{background:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:14px;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--rosa);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- modo apresentação ---------- */
#pres{position:fixed;inset:0;background:#0d0d0d;z-index:100;user-select:none}
#pres .stage{position:absolute;inset:0;overflow:hidden}
#pres .stg{position:absolute;width:1920px;height:1080px;transform-origin:0 0;box-shadow:0 0 80px rgba(0,0,0,.6)}
#pres .stg .sl{animation:sin .45s cubic-bezier(.2,.7,.2,1)}
#pres .stg.back .sl{animation-name:sinb}
@keyframes sin{from{opacity:0;transform:translateX(40px)}}
@keyframes sinb{from{opacity:0;transform:translateX(-40px)}}
#pres .prog{position:absolute;top:0;left:0;height:5px;background:var(--grad);transition:width .35s;z-index:3}
#pres .ctl{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(20,20,20,.86);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:6px;color:#fff;transition:opacity .3s;z-index:4}
#pres.idle .ctl,#pres.idle .side{opacity:0;pointer-events:none}
#pres.idle{cursor:none}
#pres .ctl button{border:0;background:transparent;color:#fff;padding:10px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
#pres .ctl button:hover{background:rgba(255,255,255,.12)}
#pres .ctl svg{width:22px;height:22px}
#pres .ctl .cnt{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:600;font-size:16px;padding:0 10px;min-width:84px;text-align:center}
#pres .side{position:absolute;top:50%;transform:translateY(-50%);width:70px;height:140px;border:0;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;z-index:3;transition:opacity .3s;display:grid;place-items:center}
#pres .side:hover{color:#fff}
#pres .side svg{width:44px;height:44px}
#pres .side.l{left:0}#pres .side.r{right:0}
#pres .notes{position:absolute;right:20px;bottom:90px;width:min(460px,90vw);max-height:45vh;overflow:auto;background:rgba(20,20,20,.92);color:#fff;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.5;z-index:4;border:1px solid rgba(255,255,255,.12)}
#pres .notes b{display:block;font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
#pres .ovw{position:absolute;inset:0;background:rgba(13,13,13,.97);z-index:5;overflow:auto;padding:30px}
#pres .ovw .grid .th{background:#1c1c1c;border-color:#2c2c2c;color:#fff}
#pres .ovw .th.cur{outline:3px solid var(--rosa)}

/* =========================================================
   SLIDES (1920 x 1080) — tudo escala com --k (auto-ajuste)
   ========================================================= */
.sl{--k:1;width:1920px;height:1080px;position:relative;overflow:hidden;background:#FBFAF7;color:#161616;font-family:'Nunito Sans',sans-serif;
  --tx2:#5F5D58;--card:#fff;--cardb:#ECE9E2;
  --f-ttl:calc(76px*var(--k));--f-sub:calc(32px*var(--k));--f-txt:calc(32px*var(--k));--f-sm:calc(27px*var(--k));--f-xs:calc(23px*var(--k))}
.sl *{box-sizing:border-box}
.sl strong{font-weight:800;color:var(--ac-ink)}
.sl .top{position:absolute;top:58px;left:110px;right:110px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.sl .pill{display:inline-flex;align-items:center;gap:12px;font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-ink);background:var(--ac-soft);padding:11px 24px;border-radius:99px}
.sl .pill svg{width:24px;height:24px}
.sl .tlogo{height:50px}
.sl .foot{position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--grad)}
.sl .pg{position:absolute;bottom:34px;right:110px;font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:500;font-size:22px;color:#A4A19A;letter-spacing:.06em;z-index:2}
.sl .mk{position:absolute;bottom:34px;left:110px;font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:500;font-size:20px;color:#A4A19A;letter-spacing:.14em;text-transform:uppercase;z-index:2}
.sl .main{position:absolute;top:150px;left:110px;right:110px;bottom:96px;display:flex;flex-direction:column;overflow:hidden;z-index:1}
.sl.img-r .main{right:900px}.sl.img-l .main{left:900px}
.sl .ttl{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:700;font-size:var(--f-ttl);line-height:1.05;letter-spacing:-.01em;margin:0}
.sl .sub{font-size:var(--f-sub);color:var(--tx2);margin:calc(16px*var(--k)) 0 0;line-height:1.35;font-weight:600}
.sl .body{flex:1;min-height:0;margin-top:calc(46px*var(--k));display:flex;flex-direction:column;justify-content:center}
.sl .pic{position:absolute;top:150px;bottom:96px;width:740px;border-radius:36px;overflow:hidden;background:var(--ac-soft);z-index:1}
.sl.img-r .pic{right:110px}.sl.img-l .pic{left:110px}
.sl .pic img{width:100%;height:100%;object-fit:cover;display:block}
.sl .pic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
/* fundo com imagem */
.sl.img-bg{color:#fff;--tx2:rgba(255,255,255,.85);--card:rgba(255,255,255,.12);--cardb:rgba(255,255,255,.2)}
.sl.img-bg .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl.img-bg .bgov{position:absolute;inset:0;background:linear-gradient(100deg,rgba(14,14,14,.92) 0%,rgba(14,14,14,.78) 45%,rgba(14,14,14,.35) 100%)}
.sl.img-bg strong{color:#fff;text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:4px;text-underline-offset:6px}
.sl.img-bg .pill{background:rgba(255,255,255,.14);color:#fff}
.sl.img-bg .card{backdrop-filter:blur(6px)}

/* cartões */
.sl .cards{display:grid;gap:calc(28px*var(--k));grid-template-columns:repeat(var(--cols),minmax(0,1fr));align-content:center}
.sl .card{background:var(--card);border:1px solid var(--cardb);border-radius:30px;padding:calc(38px*var(--k));display:flex;gap:calc(28px*var(--k));box-shadow:0 22px 44px -32px rgba(0,0,0,.28)}
.sl .cards.big .card{flex-direction:column;padding:calc(46px*var(--k)) calc(42px*var(--k))}
.sl .cards.row .card{align-items:center;padding:calc(26px*var(--k)) calc(32px*var(--k))}
.sl .bub{flex:none;width:calc(86px*var(--k));height:calc(86px*var(--k));border-radius:calc(24px*var(--k));background:var(--ac-soft);color:var(--ac-ink);display:grid;place-items:center}
.sl .bub svg{width:52%;height:52%}
.sl .cards.big .bub{width:calc(104px*var(--k));height:calc(104px*var(--k));border-radius:calc(30px*var(--k))}
.sl .ct{font-size:var(--f-txt);line-height:1.32;font-weight:600}
.sl .cards.big .ct{font-size:calc(36px*var(--k))}
.sl .cards.sm .ct{font-size:var(--f-sm)}
.sl .cards.r4 .card{padding:calc(40px*var(--k)) calc(40px*var(--k))}
.sl .cards.r4 .ct{font-size:calc(36px*var(--k))}
.sl .cards.r4 .bub{width:calc(100px*var(--k));height:calc(100px*var(--k))}
.sl .cards.sm .bub{width:calc(70px*var(--k));height:calc(70px*var(--k));border-radius:calc(20px*var(--k))}
.sl .tag{display:block;font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-size:calc(20px*var(--k));letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:4px}
.sl .k-proibido{border:2px solid #F3C4C4;background:#FFF7F7}
.sl .k-proibido .bub{background:#FDE3E3;color:var(--red)}
.sl .k-proibido strong{color:var(--red)}
.sl .k-destaque{background:var(--ac);border-color:var(--ac);color:var(--ac-on)}
.sl .k-destaque .bub{background:rgba(255,255,255,.22);color:var(--ac-on)}
.sl .k-destaque strong{color:var(--ac-on);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.sl.img-bg .k-proibido{background:rgba(217,54,54,.25);border-color:rgba(255,160,160,.5)}
.sl.img-bg .k-proibido .bub{background:rgba(255,255,255,.18);color:#fff}
.sl.img-bg .k-proibido .tag,.sl.img-bg .k-proibido strong{color:#FFC9C9}

/* lista em linhas */
.sl .rows{display:flex;flex-direction:column}
.sl .rows .rw{display:flex;align-items:center;gap:calc(26px*var(--k));padding:calc(22px*var(--k)) 0;border-bottom:2px solid var(--cardb)}
.sl .rows .rw:last-child{border-bottom:0}
.sl .rows .bub{width:calc(72px*var(--k));height:calc(72px*var(--k));border-radius:calc(20px*var(--k))}
.sl .rows .ct{font-size:calc(31px*var(--k))}
.sl .rows .k-proibido{border:0;background:transparent;border-bottom:2px solid var(--cardb)}

/* capa */
.sl-capa{background:#FBFAF7}
.sl-capa .cv{position:absolute;left:130px;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center;z-index:2}
.sl-capa .cv .lg{width:560px;margin-bottom:70px}
.sl-capa .cv .gb{width:150px;height:12px;border-radius:99px;background:var(--grad);margin-bottom:40px}
.sl-capa .cv h1{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:700;font-size:calc(96px*var(--k));line-height:1.02;letter-spacing:-.015em;margin:0}
.sl-capa .cv p{font-size:calc(36px*var(--k));color:var(--tx2);margin:30px 0 0;font-weight:600;line-height:1.35}
.sl-capa .cv .pill{align-self:flex-start;margin-top:56px}
.sl-capa .bagart{position:absolute;right:120px;top:120px;bottom:120px;width:740px}
.sl-capa .bagart svg{width:100%;height:100%}
.sl-capa .pic{top:110px;bottom:110px;right:110px;width:760px;border-radius:44px}
.sl-capa .blob{position:absolute;right:-180px;top:-180px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(236,42,144,.08),rgba(236,42,144,0) 65%)}

/* seção */
.sl-secao{background:var(--ac);color:var(--ac-on)}
.sl-secao .sv{position:absolute;left:130px;top:0;bottom:0;width:1050px;display:flex;flex-direction:column;justify-content:center;z-index:2}
.sl-secao .num{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:800;font-size:calc(330px*var(--k));line-height:.8;letter-spacing:-.04em;opacity:.95;margin-bottom:40px}
.sl-secao .lbl{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:26px;opacity:.85;margin-bottom:18px}
.sl-secao h1{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:700;font-size:calc(104px*var(--k));line-height:1.02;letter-spacing:-.015em;margin:0}
.sl-secao p{font-size:calc(36px*var(--k));opacity:.88;margin:28px 0 0;font-weight:600;line-height:1.35}
.sl-secao .wv{position:absolute;right:-60px;top:-40px;bottom:-40px;width:900px;opacity:.9}
.sl-secao .wv svg{width:100%;height:100%}
.sl-secao .pic{right:110px;top:110px;bottom:110px;width:640px;border-radius:44px;box-shadow:0 0 0 14px rgba(255,255,255,.25)}
.sl-secao .tlogo{position:absolute;top:58px;right:110px;height:50px;z-index:3}
.sl-secao .foot{background:rgba(255,255,255,.35)}

/* agenda */
.sl .ag{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:calc(18px*var(--k)) calc(40px*var(--k))}
.sl .ag .a{display:flex;align-items:center;gap:calc(32px*var(--k));padding:calc(22px*var(--k)) calc(34px*var(--k));background:var(--card);border:1px solid var(--cardb);border-radius:26px}
.sl .ag .no{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:800;font-size:calc(64px*var(--k));width:calc(110px*var(--k));color:var(--c)}
.sl .ag .ai{width:calc(70px*var(--k));height:calc(70px*var(--k));border-radius:20px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.sl .ag .ai svg{width:55%;height:55%}
.sl .ag .at{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:600;font-size:calc(42px*var(--k));line-height:1.15}

/* número em destaque */
.sl .nm{display:grid;grid-template-columns:600px 1fr;gap:calc(80px*var(--k));align-items:stretch;flex:1;min-height:0}
.sl .nm .big{background:var(--ac);color:var(--ac-on);border-radius:40px;padding:56px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.sl .nm .big .v{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:800;font-size:calc(150px*var(--k));line-height:.92;letter-spacing:-.03em;position:relative}
.sl .nm .big .lg2{font-size:calc(32px*var(--k));font-weight:700;margin-top:24px;line-height:1.3;position:relative;opacity:.95}
.sl .nm .big .ic{position:absolute;top:48px;left:56px;width:96px;height:96px;opacity:.9}
.sl .nm .big .ring{position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.14)}
.sl .nm .rows{justify-content:center}

/* citação */
.sl .qt{background:var(--ac-soft);border-radius:40px;padding:calc(50px*var(--k)) calc(64px*var(--k));position:relative;margin-bottom:calc(36px*var(--k))}
.sl .qt .qm{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:800;font-size:calc(170px*var(--k));line-height:.6;color:var(--ac);height:calc(70px*var(--k))}
.sl .qt .qx{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:500;font-size:calc(50px*var(--k));line-height:1.22;letter-spacing:-.005em}
.sl .qt .ql{margin-top:calc(22px*var(--k));font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:600;font-size:calc(22px*var(--k));letter-spacing:.16em;text-transform:uppercase;color:var(--ac-ink)}
.sl.img-bg .qt{background:rgba(255,255,255,.12)}.sl.img-bg .qt .ql{color:#fff}

/* passos */
.sl .ps{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:calc(30px*var(--k));position:relative}
.sl .ps::before{content:"";position:absolute;top:calc(48px*var(--k));left:8%;right:8%;height:6px;border-radius:3px;background:var(--ac-soft)}
.sl .ps .p{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.sl .ps .pn{width:calc(96px*var(--k));height:calc(96px*var(--k));border-radius:50%;background:var(--ac);color:var(--ac-on);font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:700;font-size:calc(44px*var(--k));display:grid;place-items:center;box-shadow:0 0 0 12px #FBFAF7}
.sl .ps .pc{margin-top:calc(40px*var(--k));background:var(--card);border:1px solid var(--cardb);border-radius:30px;padding:calc(40px*var(--k)) calc(30px*var(--k));width:100%;flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(24px*var(--k));box-shadow:0 22px 44px -32px rgba(0,0,0,.28)}
.sl .ps .pc .ct{font-size:var(--f-sm)}

/* checklist */
.sl .ck{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:calc(18px*var(--k))}
.sl .ck .c{display:flex;align-items:center;gap:calc(18px*var(--k));background:var(--card);border:1px solid var(--cardb);border-radius:20px;padding:calc(20px*var(--k)) calc(24px*var(--k))}
.sl .ck .cb{flex:none;width:calc(48px*var(--k));height:calc(48px*var(--k));border-radius:50%;background:var(--ac);color:var(--ac-on);display:grid;place-items:center}
.sl .ck .cb svg{width:60%;height:60%;stroke-width:3}
.sl .ck .ct{font-size:calc(26px*var(--k));line-height:1.25;font-weight:700}

/* mensagem de impacto */
.sl-destaque .dz{flex:1;display:flex;flex-direction:column;justify-content:center;border-left:16px solid var(--ac);padding-left:calc(70px*var(--k))}
.sl-destaque .dz .di{width:calc(120px*var(--k));height:calc(120px*var(--k));border-radius:34px;background:var(--ac-soft);color:var(--ac-ink);display:grid;place-items:center;margin-bottom:calc(44px*var(--k))}
.sl-destaque .dz .di svg{width:55%;height:55%}
.sl-destaque .dz .dk{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:calc(28px*var(--k));color:var(--ac-ink);margin-bottom:22px}
.sl-destaque .dz .dt{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:600;font-size:calc(80px*var(--k));line-height:1.1;letter-spacing:-.012em}
.sl-destaque .dz .dl{font-size:calc(34px*var(--k));color:var(--tx2);margin-top:calc(34px*var(--k));font-weight:600;line-height:1.35}
.sl-destaque.img-bg .dz .dk{color:#fff}.sl-destaque.img-bg .dz .di{background:rgba(255,255,255,.15);color:#fff}

/* encerramento */
.sl-encerramento{background:#161616;color:#fff}
.sl-encerramento .ev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 200px;z-index:2}
.sl-encerramento .ev .lg{width:520px;margin-bottom:80px}
.sl-encerramento .ev h1{font-family:Jost,Futura,'Century Gothic','Trebuchet MS',sans-serif;font-weight:700;font-size:calc(104px*var(--k));line-height:1.04;margin:0;letter-spacing:-.015em}
.sl-encerramento .ev p{font-size:calc(36px*var(--k));opacity:.78;margin:32px 0 0;font-weight:600;line-height:1.4}
.sl-encerramento .ev .gb{width:180px;height:12px;border-radius:99px;background:var(--grad);margin-top:60px}
.sl-encerramento .wv{position:absolute;inset:0;opacity:.5}
.sl-encerramento .wv svg{width:100%;height:100%}
</style>

function ic(name, extra) {
  const d = (IC[name] || IC.check)[1].split('|').map(p => {
    if (p.startsWith('c:')) { const [x, y, r] = p.slice(2).split(','); return `<circle cx="${x}" cy="${y}" r="${r}"/>`; }
    if (p.startsWith('r:')) { const [x, y, w, h, rx] = p.slice(2).split(','); return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx || 0}"/>`; }
    return `<path d="${p}"/>`;
  }).join('');
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra || ''}>${d}</svg>`;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
const pal = c => PAL[c] || PAL.rosa;

function slideHTML(s, n, total) {
  const p = pal(s.cor);
  const L = LAYOUTS[s.layout] ? s.layout : 'lista';
  const style = `--ac:${p.ac};--ac-ink:${p.ink};--ac-soft:${p.soft};--ac-on:${p.on}`;
  const hasImg = !!(s.imgUrl && LAYOUTS[L].img);
  let pos = hasImg ? (s.imgPos || 'direita') : '';
  if (L === 'capa' || L === 'secao') pos = hasImg ? 'direita' : '';
  const cls = pos === 'direita' ? 'img-r' : pos === 'esquerda' ? 'img-l' : pos === 'fundo' ? 'img-bg' : '';
  const dark = cls === 'img-bg';
  const pg = `<div class="pg">${String(n).padStart(2, '0')} / ${String(total).padStart(2, '0')}</div>`;
  const top = `<div class="top">${s.secao ? `<span class="pill">${s.icone ? ic(s.icone) : ''}${esc(s.secao)}</span>` : '<span></span>'}<img class="tlogo" src="${dark ? LOGO_BRANCA : LOGO_PRETA}" alt="Miashop"></div>`;
  const foot = `<div class="foot"></div><div class="mk">Integração Miashop</div>${pg}`;
  const pic = hasImg && cls !== 'img-bg' ? `<div class="pic"><img src="${esc(s.imgUrl)}" alt="" referrerpolicy="no-referrer"></div>` : '';
  const bg = hasImg && cls === 'img-bg' ? `<img class="bgimg" src="${esc(s.imgUrl)}" alt="" referrerpolicy="no-referrer"><div class="bgov"></div>` : '';
  const narrow = cls === 'img-r' || cls === 'img-l';
  const head = `<h2 class="ttl">${fmt(s.titulo)}</h2>${s.subtitulo ? `<p class="sub">${fmt(s.subtitulo)}</p>` : ''}`;
  const itens = (s.itens || []).filter(i => String(i.t || '').trim());
  let inner = '';

  switch (L) {
    case 'capa':
      inner = `<div class="blob"></div><div class="cv">
          <img class="lg" src="${LOGO_PRETA}" alt="Miashop"><div class="gb"></div>
          <h1>${fmt(s.titulo)}</h1>${s.subtitulo ? `<p>${fmt(s.subtitulo)}</p>` : ''}
          ${s.secao ? `<span class="pill">${s.icone ? ic(s.icone) : ''}${esc(s.secao)}</span>` : ''}</div>
        ${hasImg ? pic : `<div class="bagart">${BAG_ART}</div>`}<div class="foot"></div>`;
      return wrap(`sl-capa ${hasImg ? 'img-r' : ''}`, style, inner);
    case 'secao': {
      const lime = p.on !== '#FFFFFF';
      inner = `${hasImg ? pic : `<div class="wv">${LINE_WAVES(lime ? '#161616' : '#ffffff', lime ? .08 : .16)}</div>`}
        <img class="tlogo" src="${lime ? LOGO_PRETA : LOGO_BRANCA}" alt="Miashop">
        <div class="sv">${s.destaque ? `<div class="num">${esc(s.destaque)}</div>` : ''}
          ${s.secao ? `<div class="lbl">${esc(s.secao)}</div>` : ''}<h1>${fmt(s.titulo)}</h1>${s.subtitulo ? `<p>${fmt(s.subtitulo)}</p>` : ''}</div>
        <div class="foot"></div>`;
      return wrap('sl-secao', style, inner);
    }
    case 'encerramento':
      inner = `<div class="wv">${LINE_WAVES('#ffffff', .05)}</div><div class="ev"><img class="lg" src="${LOGO_BRANCA}" alt="Miashop">
        <h1>${fmt(s.titulo)}</h1>${s.subtitulo ? `<p>${fmt(s.subtitulo)}</p>` : ''}<div class="gb"></div></div><div class="foot"></div>`;
      return wrap('sl-encerramento', style, inner);
    case 'agenda': {
      const cols = itens.length > 5 ? 2 : 1;
      inner = `<div class="ag" style="--cols:${cols}">${itens.map((it, i) => {
        const c = pal(CICLO[i % CICLO.length]).ac;
        return `<div class="a" style="--c:${c}"><div class="no">${String(i + 1).padStart(2, '0')}</div><div class="ai">${ic(it.i || 'check')}</div><div class="at">${fmt(it.t)}</div></div>`;
      }).join('')}</div>`;
      break;
    }
    case 'numero':
      inner = `<div class="nm"><div class="big"><div class="ring"></div>${s.icone ? `<div class="ic">${ic(s.icone)}</div>` : ''}
          <div class="v">${esc(s.destaque || '')}</div>${s.destaqueLegenda ? `<div class="lg2">${fmt(s.destaqueLegenda)}</div>` : ''}</div>
        ${rowsHTML(itens)}</div>`;
      break;
    case 'citacao':
      inner = `<div class="qt"><div class="qm">“</div><div class="qx">${fmt(s.destaque || '')}</div>${s.destaqueLegenda ? `<div class="ql">${esc(s.destaqueLegenda)}</div>` : ''}</div>
        ${itens.length ? cardsHTML(itens, narrow, true) : ''}`;
      break;
    case 'passos':
      inner = `<div class="ps" style="--cols:${Math.max(1, itens.length)}">${itens.map((it, i) => `<div class="p"><div class="pn">${i + 1}</div>
        <div class="pc"><div class="bub">${ic(it.i || 'check')}</div><div class="ct">${fmt(it.t)}</div></div></div>`).join('')}</div>`;
      break;
    case 'proibidos':
      inner = cardsHTML(itens.map(it => Object.assign({}, it, { k: 'proibido' })), narrow, false, true);
      break;
    case 'checklist': {
      const cols = itens.length > 12 ? 4 : itens.length > 6 ? 3 : 2;
      inner = `<div class="ck" style="--cols:${cols}">${itens.map(it => `<div class="c"><div class="cb">${ic('check')}</div><div class="ct">${fmt(it.t)}</div></div>`).join('')}</div>`;
      break;
    }
    case 'destaque':
      inner = `<div class="dz">${s.icone ? `<div class="di">${ic(s.icone)}</div>` : ''}<div class="dk">${fmt(s.titulo)}</div>
        <div class="dt">${fmt(s.destaque || '')}</div>${s.destaqueLegenda ? `<div class="dl">${fmt(s.destaqueLegenda)}</div>` : ''}</div>`;
      return wrap(`sl-destaque ${cls}`, style, `${bg}${top}${pic}<div class="main">${inner}</div>${foot}`);
    default:
      inner = cardsHTML(itens, narrow);
  }
  return wrap(`sl-${L} ${cls}`, style, `${bg}${top}${pic}<div class="main">${head}<div class="body">${inner}</div></div>${foot}`);
}
function wrap(cls, style, inner) { return `<div class="sl ${cls}" style="${style}">${inner}</div>`; }

function cardsHTML(itens, narrow, compactTop, proib) {
  const n = itens.length;
  let mode, cols, sm = false;
  if (narrow) { mode = 'row'; cols = n > 6 ? 2 : 1; sm = n >= 5; }
  else if (compactTop) { mode = n <= 3 ? 'row' : 'row'; cols = Math.min(n, 3); sm = true; }
  else if (n <= 3) { mode = 'big'; cols = n; }
  else if (n === 4) { mode = 'row r4'; cols = 2; }
  else if (n <= 6) { mode = proib ? 'row' : 'big'; cols = proib ? 2 : 3; sm = proib; }
  else if (n <= 8) { mode = 'row'; cols = 2; sm = true; }
  else { mode = 'row'; cols = 3; sm = true; }
  return `<div class="cards ${mode} ${sm ? 'sm' : ''}" style="--cols:${cols}">${itens.map(it => {
    const k = it.k || 'normal';
    const icon = k === 'proibido' ? 'ban' : (it.i || 'check');
    return `<div class="card k-${k}"><div class="bub">${ic(icon)}</div><div class="ct">${k === 'proibido' ? '<b class="tag">Proibido</b>' : ''}${fmt(it.t)}</div></div>`;
  }).join('')}</div>`;
}
function rowsHTML(itens) {
  return `<div class="rows">${itens.map(it => {
    const k = it.k || 'normal';
    const icon = k === 'proibido' ? 'ban' : (it.i || 'check');
    return `<div class="rw k-${k === 'destaque' ? 'normal' : k}"><div class="bub">${ic(icon)}</div><div class="ct">${k === 'proibido' ? '<b class="tag">Proibido</b>' : ''}${fmt(it.t)}</div></div>`;
  }).join('')}</div>`;
}

/* auto-ajuste: reduz o texto até caber no slide */
function fitSlide(sl) {
  const box = sl.querySelector('.main') || sl.querySelector('.cv,.sv,.ev');
  if (!box) return;
  let k = 1; sl.style.setProperty('--k', '1');
  let guard = 0;
  while (guard++ < 14 && k > 0.55 && (box.scrollHeight > box.clientHeight + 2 || box.scrollWidth > box.clientWidth + 2)) {
    k -= 0.05; sl.style.setProperty('--k', k.toFixed(2));
  }
}
function fitIn(root) { (root || document).querySelectorAll('.sl').forEach(fitSlide); }

/* scaler */
const RO = new ResizeObserver(es => es.forEach(e => {
  const st = e.target.firstElementChild; if (st) st.style.transform = `scale(${e.contentRect.width / 1920})`;
}));
const scaler = html => `<div class="scaler"><div class="stg">${html}</div></div>`;
function mountScalers(root) {
  (root || document).querySelectorAll('.scaler').forEach(el => {
    if (!el.dataset.o) { el.dataset.o = 1; RO.observe(el); }
    const st = el.firstElementChild; if (st) st.style.transform = `scale(${el.clientWidth / 1920})`;
  });
  fitIn(root);
}

/* =========================================================
   API (Apps Script) + MODO DEMO
   ========================================================= */
const LS = { sess: 'miaInt.sessao', dUsers: 'miaInt.demo.usuarios', dDeck: 'miaInt.demo.slides', pos: 'miaInt.pos.' };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DEMO = !API_URL;

async function api(action, data) {
  const body = Object.assign({ action, token: S.sess && S.sess.token }, data || {});
  let res;
  if (DEMO) res = await demoApi(body);
  else {
    let r;
    try {
      r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
    } catch (e) { throw new Error('Sem conexão com o servidor. Verifique a internet.'); }
    try { res = await r.json(); } catch (e) { throw new Error('Resposta inválida do servidor. Confira a implantação do Apps Script.'); }
  }
  if (res && res.auth) { logout(true); throw new Error(res.erro || 'Sessão expirada.'); }
  return res;
}

async function demoApi(b) {
  await new Promise(r => setTimeout(r, 120));
  let users = lsGet(LS.dUsers, null);
  if (!users) { users = [{ login: 'MASTER', nome: 'Master', senha: 'HERA', perfil: 'MASTER', ativo: true, criadoEm: agora(), ultimoAcesso: '' }]; lsSet(LS.dUsers, users); }
  const me = b.token ? users.find(u => 'demo-' + u.login === b.token) : null;
  if (b.action !== 'login' && !me) return { ok: false, auth: true, erro: 'Sessão expirada.' };
  const master = me && me.perfil === 'MASTER';
  const deny = { ok: false, erro: 'Apenas o MASTER pode fazer isso.' };
  const deck = lsGet(LS.dDeck, { slides: [], versao: '' });
  switch (b.action) {
    case 'login': {
      const u = users.find(x => x.login === String(b.login || '').trim().toUpperCase());
      if (!u || !u.ativo || u.senha !== b.senha) return { ok: false, erro: 'Login ou senha inválidos.' };
      u.ultimoAcesso = agora(); lsSet(LS.dUsers, users);
      return { ok: true, token: 'demo-' + u.login, usuario: { login: u.login, nome: u.nome, perfil: u.perfil } };
    }
    case 'slides.get': return { ok: true, slides: master ? deck.slides : deck.slides.filter(s => s.ativo), versao: deck.versao, atualizadoPor: deck.por, atualizadoEm: deck.em };
    case 'slides.save': {
      if (!master) return deny;
      if (!b.force && deck.versao && b.baseVersion !== deck.versao) return { ok: false, conflito: true, versao: deck.versao, atualizadoPor: deck.por, atualizadoEm: deck.em };
      const nv = { slides: b.slides, versao: String(Date.now()), por: me.login, em: agora() };
      try { localStorage.setItem(LS.dDeck, JSON.stringify(nv)); } catch (e) { return { ok: false, erro: 'Espaço do navegador cheio (modo demo). Use imagens menores ou configure o Apps Script.' }; }
      return { ok: true, versao: nv.versao, atualizadoPor: nv.por, atualizadoEm: nv.em };
    }
    case 'foto.upload': return master ? { ok: true, id: 'demo-' + uid(), url: 'data:' + b.mime + ';base64,' + b.base64 } : deny;
    case 'users.list': return master ? { ok: true, usuarios: users.map(u => ({ login: u.login, nome: u.nome, perfil: u.perfil, ativo: u.ativo, criadoEm: u.criadoEm, ultimoAcesso: u.ultimoAcesso })) } : deny;
    case 'users.create': {
      if (!master) return deny;
      const login = String(b.login || '').trim().toUpperCase();
      if (!/^[A-Z0-9._-]{3,30}$/.test(login)) return { ok: false, erro: 'Login: 3 a 30 caracteres (letras, números, ponto, hífen).' };
      if (!String(b.nome || '').trim()) return { ok: false, erro: 'Informe o nome.' };
      if (String(b.senha || '').length < 4) return { ok: false, erro: 'A senha precisa ter pelo menos 4 caracteres.' };
      if (users.some(u => u.login === login)) return { ok: false, erro: 'Já existe um usuário com esse login.' };
      users.push({ login, nome: b.nome.trim(), senha: b.senha, perfil: 'VISUALIZADOR', ativo: true, criadoEm: agora(), ultimoAcesso: '' });
      lsSet(LS.dUsers, users); return { ok: true };
    }
    case 'users.update': {
      if (!master) return deny;
      const u = users.find(x => x.login === b.login); if (!u) return { ok: false, erro: 'Usuário não encontrado.' };
      if (u.perfil === 'MASTER' && b.ativo === false) return { ok: false, erro: 'O MASTER não pode ser desativado.' };
      if (b.nome) u.nome = b.nome; if (b.ativo != null) u.ativo = b.ativo; if (b.senha) u.senha = b.senha;
      lsSet(LS.dUsers, users); return { ok: true };
    }
    case 'users.delete': {
      if (!master) return deny;
      const u = users.find(x => x.login === b.login);
      if (!u || u.perfil === 'MASTER') return { ok: false, erro: 'O MASTER não pode ser excluído.' };
      lsSet(LS.dUsers, users.filter(x => x !== u)); return { ok: true };
    }
    case 'senha.alterar': {
      if (me.senha !== b.atual) return { ok: false, erro: 'Senha atual incorreta.' };
      if (String(b.nova || '').length < 4) return { ok: false, erro: 'A nova senha precisa ter pelo menos 4 caracteres.' };
      me.senha = b.nova; lsSet(LS.dUsers, users); return { ok: true };
    }
    case 'logout': return { ok: true };
  }
  return { ok: false, erro: 'Ação desconhecida.' };
}
function agora() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

const $ = (q, r) => (r || document).querySelector(q);
const $$ = (q, r) => [...(r || document).querySelectorAll(q)];
const isMaster = () => S.sess && S.sess.perfil === 'MASTER';

function toast(msg, type) {
  const el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), type === 'err' ? 5000 : 2800);
}
function modal(title, html, buttons) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="md"><h3>${title}</h3>${html}<div class="acts">${(buttons || [{ t: 'OK', v: true, c: 'pri' }])
      .map((b, i) => `<button class="btn ${b.c || ''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov);
    const close = v => { ov.remove(); resolve(v); };
    ov.addEventListener('click', e => {
      if (e.target === ov) return close(null);
      const b = e.target.closest('[data-i]'); if (!b) return;
      const def = buttons[+b.dataset.i]; close(typeof def.v === 'function' ? def.v(ov) : def.v);
    });
    const f = ov.querySelector('input,select,textarea'); if (f) setTimeout(() => f.focus(), 30);
    ov.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
  });
}
async function ask(title, text, okTxt, danger) {
  return modal(title, `<p>${text}</p>`, [{ t: 'Cancelar', v: false }, { t: okTxt || 'Confirmar', v: true, c: danger ? 'rosa' : 'pri' }]);
}

  if (!S.deck.slides.length) {

      if (s.ok) { S.deck.versao = s.versao; S.deck.por = s.atualizadoPor; S.deck.em = s.atualizadoEm; toast('Conteúdo do manual carregado na planilha.', 'ok'); }

/* ---------- MODO APRESENTAÇÃO ---------- */
const P = { list: [], i: 0, el: null, idleT: null, notes: false };
function openPresent(list, start) {
  closePresent();
  P.list = list; P.i = Math.max(0, Math.min(start || 0, list.length - 1)); P.notes = false;
  const el = document.createElement('div'); el.id = 'pres'; P.el = el;
  el.innerHTML = `<div class="prog"></div><div class="stage"><div class="stg"></div></div>
    <button class="side l" data-a="prev">${ic('_l')}</button><button class="side r" data-a="next">${ic('_r')}</button>
    <div class="ctl"><button data-a="prev" title="Anterior (←)">${ic('_l')}</button><div class="cnt"></div><button data-a="next" title="Próximo (→)">${ic('_r')}</button>
      <button data-a="grid" title="Visão geral (G)">${ic('grid')}</button><button data-a="notes" title="Notas (N)">${ic('file')}</button>
      <button data-a="fs" title="Tela cheia (F)">${ic('_max')}</button><button data-a="close" title="Sair (Esc)">${ic('_x')}</button></div>
    <div class="notes hidden"></div><div class="ovw hidden"></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (b) { const a = b.dataset.a;
      if (a === 'prev') go(-1); else if (a === 'next') go(1); else if (a === 'close') closePresent();
      else if (a === 'fs') toggleFs(); else if (a === 'grid') toggleOverview(); else if (a === 'notes') { P.notes = !P.notes; showP(0); }
      return; }
    const t = e.target.closest('.ovw .th'); if (t) { P.i = +t.dataset.i; toggleOverview(false); showP(0); }
  });
  let tx = null;
  el.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); tx = null; });
  el.addEventListener('mousemove', wake);
  document.addEventListener('keydown', presKey);
  window.addEventListener('resize', layoutP);
  showP(0); wake();
}
function closePresent() {
  if (!P.el) return;
  P.el.remove(); P.el = null;
  document.removeEventListener('keydown', presKey); window.removeEventListener('resize', layoutP);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (S.view === 'home' && $('#view')) renderHome();
}
function presKey(e) {
  if (!P.el) return;
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); go(1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(-1); }
  else if (k === 'Home') { P.i = 0; showP(0); } else if (k === 'End') { P.i = P.list.length - 1; showP(0); }
  else if (k === 'Escape') { if (!$('.ovw', P.el).classList.contains('hidden')) toggleOverview(false); else if (!document.fullscreenElement) closePresent(); }
  else if (k === 'f' || k === 'F') toggleFs(); else if (k === 'g' || k === 'G') toggleOverview();
  else if (k === 'n' || k === 'N') { P.notes = !P.notes; showP(0); }
  wake();
}
function go(d) { const n = P.i + d; if (n < 0 || n >= P.list.length) return; P.i = n; showP(d); }
function showP(dir) {
  const st = $('.stg', P.el), s = P.list[P.i];
  st.classList.toggle('back', dir < 0);
  st.innerHTML = slideHTML(s, P.i + 1, P.list.length);
  layoutP(); fitIn(st);
  $('.cnt', P.el).textContent = `${P.i + 1} / ${P.list.length}`;
  $('.prog', P.el).style.width = ((P.i + 1) / P.list.length * 100) + '%';
  const nt = $('.notes', P.el); nt.classList.toggle('hidden', !P.notes);
  nt.innerHTML = `<b>Notas do apresentador</b>${s.notas ? fmt(s.notas) : '<span style="opacity:.6">Sem notas neste slide.</span>'}`;
  if (S.sess) lsSet(LS.pos + S.sess.login, P.i);
}
function layoutP() {
  if (!P.el) return;
  const W = innerWidth, H = innerHeight, k = Math.min(W / 1920, H / 1080);
  const st = $('.stg', P.el);
  st.style.transform = `scale(${k})`; st.style.left = ((W - 1920 * k) / 2) + 'px'; st.style.top = ((H - 1080 * k) / 2) + 'px';
}
function toggleFs() { if (document.fullscreenElement) document.exitFullscreen(); else (P.el.requestFullscreen ? P.el.requestFullscreen() : Promise.resolve()).catch(() => {}); }
function toggleOverview(force) {
  const o = $('.ovw', P.el); const show = force == null ? o.classList.contains('hidden') : force;
  o.classList.toggle('hidden', !show);
  if (show) {
    o.innerHTML = `<div class="grid">${P.list.map((s, i) => `<div class="th ${i === P.i ? 'cur' : ''}" data-i="${i}">${scaler(slideHTML(s, i + 1, P.list.length))}<div class="cap"><b>${i + 1}</b><span>${esc(s.titulo)}</span></div></div>`).join('')}</div>`;
    mountScalers(o);

}
function wake() {
  if (!P.el) return; P.el.classList.remove('idle'); clearTimeout(P.idleT);
  P.idleT = setTimeout(() => P.el && P.el.classList.add('idle'), 2600);

    ${L.dl ? `<label class="fld"><span>${L.dl}</span><input class="inp" data-f="destaqueLegenda" value="${esc(s.destaqueLegenda)}"></label>` : ''}
    ${!['agenda', 'encerramento', 'checklist'].includes(s.layout) ? `<label class="fld"><span>Ícone do slide</span><div style="display:flex;gap:8px;align-items:center"><div class="itm" style="padding:0;margin:0;border:0;background:none"><div class="ipv" id="slIcPv">${s.icone ? ic(s.icone) : ''}</div></div><select class="inp" data-f="icone">${iconOptions(s.icone)}</select></div></label>` : ''}
    ${L.img ? imageBlock(s) : ''}
    ${L.itens ? `<hr><h4>Pontos do slide <span class="hint" style="font-family:'Nunito Sans';font-weight:600">(${s.itens.length})</span></h4>
      ${tooMany ? '<div class="warn">Muitos itens deixam o slide carregado. Considere dividir em dois slides.</div>' : ''}
      <div id="edItens">${s.itens.map((it, i) => itemBlock(s, it, i)).join('')}</div>
      <button class="btn sm" id="bAddIt">${ic('_plus')}Adicionar ponto</button>` : ''}
    <hr><label class="fld"><span>Notas do apresentador</span><textarea class="inp" data-f="notas" rows="3" placeholder="Aparece só ao apertar N durante a apresentação">${esc(s.notas)}</textarea></label>`;

  $$('[data-f]', f).forEach(el => {
    const h = () => {
      const k = el.dataset.f;
      s[k] = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'layout') { if (s.layout === 'proibidos') s.itens.forEach(i => i.k = 'proibido'); if (LAYOUTS[s.layout].itens && !s.itens.length) s.itens = newSlide(s.layout).itens; renderEdForm(); }
      if (k === 'icone') { const pv = $('#slIcPv'); if (pv) pv.innerHTML = s.icone ? ic(s.icone) : ''; }
      if (k === 'imgPos') renderEdForm();
      liveUpdate();
    };
    el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', h);
  });
  $$('.sw', f).forEach(b => b.onclick = () => { s.cor = b.dataset.c; $$('.sw', f).forEach(x => x.classList.toggle('on', x === b)); liveUpdate(); });
  $$('[data-it]', f).forEach(el => {
    const i = +el.closest('.itm').dataset.i, k = el.dataset.it;
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
      s.itens[i][k] = el.value;
      if (k === 'i' || k === 'k') { const pv = $('.ipv', el.closest('.itm')); pv.innerHTML = ic(s.itens[i].k === 'proibido' ? 'ban' : (s.itens[i].i || 'check')); }
      if (k === 't') { const c = $('.cnt', el.closest('.itm')); c.textContent = el.value.replace(/\*\*/g, '').length + ' caracteres'; c.classList.toggle('long', el.value.replace(/\*\*/g, '').length > 100); }
      liveUpdate();
    });
  });
  $$('[data-ia]', f).forEach(b => b.onclick = () => {
    const i = +b.closest('.itm').dataset.i, a = b.dataset.ia;
    if (a === 'del') s.itens.splice(i, 1);
    if (a === 'up' && i > 0) [s.itens[i - 1], s.itens[i]] = [s.itens[i], s.itens[i - 1]];
    if (a === 'down' && i < s.itens.length - 1) [s.itens[i + 1], s.itens[i]] = [s.itens[i], s.itens[i + 1]];
    renderEdForm(); liveUpdate();
  });
  const add = $('#bAddIt');
  if (add) add.onclick = () => { s.itens.push({ t: '', k: s.layout === 'proibidos' ? 'proibido' : 'normal', i: 'check' }); renderEdForm(); liveUpdate(); const t = $$('#edItens textarea'); if (t.length) t[t.length - 1].focus(); };
  const up = $('#bImg'); if (up) up.onclick = () => $('#fileImg').click();
  const rm = $('#bImgRm'); if (rm) rm.onclick = () => { s.imgUrl = ''; s.imgId = ''; renderEdForm(); liveUpdate(); };
}
function imageBlock(s) {
  const posOk = !['capa', 'secao'].includes(s.layout);
  return `<hr><h4>${ic('image', 'width="18" height="18"')}Imagem de apoio</h4>
    <div class="imgbox">${s.imgUrl ? `<img src="${esc(s.imgUrl)}" referrerpolicy="no-referrer" alt="">` : '<p class="hint" style="margin:6px 0 12px">Sem imagem. Fotos de pessoas, equipe, atendimento e loja funcionam melhor.</p>'}
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn sm pri" id="bImg">${ic('_up2')}${s.imgUrl ? 'Trocar foto' : 'Enviar foto'}</button>
        ${s.imgUrl ? `<button class="btn sm danger" id="bImgRm">${ic('_trash')}Remover</button>` : ''}</div>
      <p class="hint" style="margin:10px 0 0">A foto é salva na pasta do Google Drive do sistema.</p></div>
    ${posOk && s.imgUrl ? `<label class="fld" style="margin-top:12px"><span>Posição da imagem</span><select class="inp" data-f="imgPos">
      ${[['direita', 'À direita'], ['esquerda', 'À esquerda'], ['fundo', 'Fundo do slide (texto branco)']].map(([v, t]) => `<option value="${v}" ${(s.imgPos || 'direita') === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>` : ''}`;
}
function itemBlock(s, it, i) {
  const len = String(it.t || '').replace(/\*\*/g, '').length;
  const showType = !['proibidos', 'checklist', 'agenda', 'passos'].includes(s.layout);
  const showIcon = !['proibidos', 'checklist'].includes(s.layout);
  return `<div class="itm" data-i="${i}">
    <div class="r"><div class="ipv">${ic(it.k === 'proibido' ? 'ban' : (it.i || 'check'))}</div>
      ${showIcon ? `<select class="inp" data-it="i" style="flex:1;min-width:0">${iconOptions(it.i).replace('— sem ícone —', '✓ padrão')}</select>` : '<div style="flex:1"></div>'}
      ${showType ? `<select class="inp" data-it="k" style="width:118px"><option value="normal" ${it.k === 'normal' || !it.k ? 'selected' : ''}>Normal</option><option value="destaque" ${it.k === 'destaque' ? 'selected' : ''}>Destaque</option><option value="proibido" ${it.k === 'proibido' ? 'selected' : ''}>Proibido</option></select>` : ''}
      <button class="btn sm icon" data-ia="up" title="Subir">${ic('_up')}</button><button class="btn sm icon" data-ia="down" title="Descer">${ic('_down')}</button>
      <button class="btn sm icon danger" data-ia="del" title="Remover">${ic('_x')}</button></div>
    <textarea class="inp" data-it="t" rows="2" placeholder="Texto curto e objetivo">${esc(it.t)}</textarea>
    <div class="cnt ${len > 100 ? 'long' : ''}">${len} caracteres</div></div>`;
}

/* upload de imagem: comprime no navegador e envia ao Drive */
$('#fileImg').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  const s = curSlide(); if (!s) return;
  toast('Enviando foto...');
  try {
    const { b64, mime } = await compressImage(file, 1920, 0.85);
    const r = await api('foto.upload', { base64: b64, mime, slideId: s.id });
    if (!r.ok) throw new Error(r.erro);
    s.imgId = r.id; s.imgUrl = r.url; if (!s.imgPos) s.imgPos = 'direita';
    renderEdForm(); liveUpdate(); toast('Foto enviada. Lembre de salvar.', 'ok');
  } catch (err) { toast('Erro ao enviar: ' + err.message, 'err'); }
});
function compressImage(file, maxW, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxW / img.width); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const mime = 'image/jpeg'; res({ b64: c.toDataURL(mime, q).split(',')[1], mime });
    };
    img.onerror = () => rej(new Error('Arquivo de imagem inválido.')); img.src = url;
  });
}

async function saveDeck(force) {
  const b = $('#bSave'); if (b) { b.disabled = true; b.innerHTML = ic('_save') + 'Salvando...'; }
  try {
    const r = await api('slides.save', { slides: S.draft, baseVersion: S.deck.versao, force: force === true });
    if (r.conflito) {
      const v = await modal('Outra pessoa salvou antes', `<p>A apresentação foi alterada por <b>${esc(r.atualizadoPor || 'outro usuário')}</b> em ${esc(r.atualizadoEm || '')}, depois que você abriu o editor.</p>
        <p>Você pode <b>sobrescrever</b> com a sua versão ou <b>recarregar</b> a versão mais recente (perdendo suas alterações).</p>`,
        [{ t: 'Cancelar', v: null }, { t: 'Recarregar a mais recente', v: 'reload' }, { t: 'Sobrescrever', v: 'force', c: 'rosa' }]);
      if (v === 'force') return saveDeck(true);
      if (v === 'reload') { await loadDeck(); renderEditor(); toast('Versão mais recente carregada.'); }
      setDirty(S.dirty); return;
    }
    if (!r.ok) throw new Error(r.erro);
    S.deck = { slides: JSON.parse(JSON.stringify(S.draft)), versao: r.versao, por: r.atualizadoPor, em: r.atualizadoEm };
    setDirty(false); toast('Apresentação salva.', 'ok');
  } catch (err) { toast('Erro ao salvar: ' + err.message, 'err'); setDirty(S.dirty); }
  finally { if (b) b.innerHTML = ic('_save') + 'Salvar'; }
}

async function backupMenu() {
  const v = await modal('Backup da apresentação', '<p>Baixe uma cópia de segurança (.json) ou restaure uma cópia anterior. A restauração só vale depois de clicar em Salvar.</p>',
    [{ t: 'Fechar', v: null }, { t: 'Restaurar conteúdo original do manual', v: 'seed' }, { t: 'Importar .json', v: 'imp' }, { t: 'Baixar .json', v: 'exp', c: 'pri' }]);
  if (v === 'exp') {
    const blob = new Blob([JSON.stringify({ sistema: 'Miashop Integração', data: new Date().toISOString(), slides: S.draft }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `integracao-miashop-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  } else if (v === 'imp') $('#fileJson').click();
  else if (v === 'seed') {
    if (!(await ask('Restaurar conteúdo original?', 'Os slides atuais do editor serão substituídos pelo conteúdo padrão do manual (fotos enviadas saem dos slides).', 'Restaurar', true))) return;
    S.draft = seedDeck(); S.sel = 0; setDirty(true); renderEditor();
  }
}
$('#fileJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const sl = Array.isArray(j) ? j : j.slides;
    if (!Array.isArray(sl) || !sl.length) throw new Error('Arquivo sem slides.');
    S.draft = sl.map(s => Object.assign(newSlide(s.layout && LAYOUTS[s.layout] ? s.layout : 'lista'), s, { id: s.id || uid(), itens: Array.isArray(s.itens) ? s.itens : [] }));
    S.sel = 0; setDirty(true); renderEditor(); toast('Backup importado. Clique em Salvar para gravar.', 'ok');
  } catch (err) { toast('Arquivo inválido: ' + err.message, 'err'); }
});

/* =========================================================
   USUÁRIOS (MASTER)
   ========================================================= */
async function renderUsers() {
  const v = $('#view');
  v.innerHTML = `<div class="uw">
    <section class="pane"><h3>Novo usuário</h3><p class="hint" style="margin:-8px 0 16px">Usuários novos só <b>visualizam</b> os slides.</p>
      <form id="fUser">
        <label class="fld"><span>Nome</span><input class="inp" name="nome" required placeholder="Ex.: Ana Souza"></label>
        <label class="fld"><span>Login</span><input class="inp" name="login" required placeholder="Ex.: ANA.SOUZA" style="text-transform:uppercase"></label>
        <label class="fld"><span>Senha</span><div style="display:flex;gap:6px"><input class="inp" name="senha" required minlength="4"><button type="button" class="btn sm" id="bGen">Gerar</button></div></label>
        <button class="btn pri" style="width:100%;justify-content:center">${ic('_plus')}Criar usuário</button></form></section>
    <section class="pane"><h3>Usuários cadastrados</h3><div class="tw" id="uTable"><div class="spin"></div></div></section></div>`;
  $('#bGen').onclick = () => { $('#fUser').senha.value = genPass(); };
  $('#fUser').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target, b = f.querySelector('button.pri'); b.disabled = true;
    const login = f.login.value.trim().toUpperCase(), senha = f.senha.value;
    const r = await api('users.create', { nome: f.nome.value.trim(), login, senha });
    b.disabled = false;
    if (!r.ok) return toast(r.erro, 'err');
    f.reset(); toast('Usuário criado.', 'ok'); loadUsers();
    modal('Usuário criado', `<p>Envie os dados de acesso para o colaborador:</p><div class="itm" style="font-size:16px"><b>Login:</b> ${esc(login)}<br><b>Senha:</b> ${esc(senha)}</div>`, [{ t: 'OK', v: true, c: 'pri' }]);
  });
  loadUsers();
}
function genPass() { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
async function loadUsers() {
  const box = $('#uTable'); if (!box) return;
  const r = await api('users.list'); if (!r.ok) { box.innerHTML = `<p>${esc(r.erro)}</p>`; return; }
  const us = r.usuarios.sort((a, b) => (a.perfil === 'MASTER' ? -1 : b.perfil === 'MASTER' ? 1 : a.nome.localeCompare(b.nome)));
  box.innerHTML = `<table class="t"><thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Status</th><th>Último acesso</th><th></th></tr></thead><tbody>
    ${us.map(u => `<tr data-l="${esc(u.login)}"><td><b>${esc(u.nome)}</b></td><td>${esc(u.login)}</td>
      <td>${u.perfil === 'MASTER' ? '<span class="bdg m">MASTER</span>' : '<span class="hint">Visualizador</span>'}</td>
      <td>${u.ativo ? '<span class="bdg">ATIVO</span>' : '<span class="bdg off">INATIVO</span>'}</td>
      <td class="hint">${esc(u.ultimoAcesso || '—')}</td>
      <td><div class="acts">${u.perfil === 'MASTER' ? '' : `
        <button class="btn sm" data-ua="pass">${ic('lock')}Nova senha</button>
        <button class="btn sm" data-ua="tog">${u.ativo ? ic('_eyeoff') + 'Desativar' : ic('eye') + 'Ativar'}</button>
        <button class="btn sm danger icon" data-ua="del" title="Excluir">${ic('_trash')}</button>`}</div></td></tr>`).join('')}</tbody></table>`;
  $$('[data-ua]', box).forEach(b => b.onclick = async () => {
    const login = b.closest('tr').dataset.l, u = us.find(x => x.login === login), a = b.dataset.ua; let r;
    if (a === 'pass') {
      const s = await modal('Nova senha para ' + esc(u.nome), `<label class="fld"><span>Nova senha</span><input class="inp" id="nP" value="${genPass()}"></label>`,
        [{ t: 'Cancelar', v: null }, { t: 'Salvar', c: 'pri', v: ov => $('#nP', ov).value }]);
      if (!s) return; r = await api('users.update', { login, senha: s });
      if (r.ok) modal('Senha alterada', `<div class="itm" style="font-size:16px"><b>Login:</b> ${esc(login)}<br><b>Senha:</b> ${esc(s)}</div>`, [{ t: 'OK', v: true, c: 'pri' }]);
    } else if (a === 'tog') r = await api('users.update', { login, ativo: !u.ativo });
    else if (a === 'del') { if (!(await ask('Excluir usuário?', `${esc(u.nome)} (${esc(login)}) perderá o acesso.`, 'Excluir', true))) return; r = await api('users.delete', { login }); }
    if (r && !r.ok) toast(r.erro, 'err'); else { toast('Feito.', 'ok'); loadUsers(); }
  });
}

/* ---------- atalhos globais ---------- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.view === 'editor' && !P.el) { e.preventDefault(); if (S.dirty) saveDeck(); }
});
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitIn());

boot();
</script>
